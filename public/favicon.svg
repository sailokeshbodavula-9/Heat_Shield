<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A0F" />
      <stop offset="100%" stop-color="#121824" />
    </linearGradient>

    <!-- Cool Shield Gradient -->
    <linearGradient id="shieldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Shield Facet Highlights -->
    <linearGradient id="shieldFacetLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="shieldFacetRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369A1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0C4A6E" stop-opacity="0.9" />
    </linearGradient>

    <!-- Heat Flame Gradient -->
    <linearGradient id="heatFlame" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="heatGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded App Container Background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Deflected Heat Radiation Waves (Left side deflection arcs) -->
  <g filter="url(#heatGlow)">
    <path d="M 10 22 C 16 20, 22 24, 27 20 C 31 16, 29 11, 25 12" 
          fill="none" stroke="url(#heatFlame)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 8 32 C 15 31, 23 35, 29 30 C 33 26, 31 19, 27 21" 
          fill="none" stroke="url(#heatFlame)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 12 42 C 18 41, 24 45, 29 39 C 32 35, 30 29, 26 31" 
          fill="none" stroke="url(#heatFlame)" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 16 51 C 21 50, 26 53, 30 48" 
          fill="none" stroke="url(#heatFlame)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Glowing Cool Protective Shield -->
  <g filter="url(#cyanGlow)">
    <!-- Outer Shield Rim -->
    <path d="M 36 10 L 51 16 C 51 34, 44 47, 36 54 C 28 47, 21 34, 21 16 Z" 
          fill="none" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round" />

    <!-- Left Facet -->
    <path d="M 36 12 L 23 17.5 C 23 33, 29.5 44.5, 36 51.5 Z" 
          fill="url(#shieldFacetLeft)" />

    <!-- Right Facet -->
    <path d="M 36 12 L 49 17.5 C 49 33, 42.5 44.5, 36 51.5 Z" 
          fill="url(#shieldFacetRight)" />

    <!-- Center Spine Highlight -->
    <line x1="36" y1="12" x2="36" y2="51.5" stroke="#BAE6FD" stroke-width="1.5" stroke-linecap="round" />

    <!-- Inner Protective Core (Thermal Deflector Core) -->
    <path d="M 36 21 L 43 25 C 43 35, 39 42, 36 46 C 33 42, 29 35, 29 25 Z" 
          fill="#0369A1" stroke="#38BDF8" stroke-width="1.2" opacity="0.85" />
    <circle cx="36" cy="31" r="2.5" fill="#E0F2FE" />
  </g>
</svg>
